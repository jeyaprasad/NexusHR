name: insii-hr
services:
  # 1. PostgreSQL Database
  db:
    image: pgvector/pgvector:pg16
    container_name: insiihr-db
    environment:
      POSTGRES_DB: insiihr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: insiihr-redis
    ports:
      - "6379:6379"

  # 3. Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insiihr-backend
    ports:
      - "8080:8080"
    volumes:
      - onnx-cache:/tmp/spring-ai-onnx-generative
      - djl-cache:/root/.cache/djl
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/insiihr
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - GROQ_API_KEY=${GROQ_API_KEY:-mock-key}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AI=DEBUG
    depends_on:
      - db
      - redis

  # 4. React 19 / TanStack Start Frontend (Dev - SSR with Hot Reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: insiihr-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_SHOW_DEMO_CREDENTIALS=${VITE_SHOW_DEMO_CREDENTIALS:-true}
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend


volumes:
  pgdata:
  onnx-cache:
  djl-cache: