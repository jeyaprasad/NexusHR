databases:
  # 1. PostgreSQL Database
  - name: nexushr-db
    plan: free
    databaseName: nexushr
    user: nexushr_user

services:
  # 2. Spring Boot Backend
  - type: web
    name: nexushr-backend
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render automatically provisions these environment variables internally
      - key: DB_HOST
        fromDatabase:
          name: nexushr-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexushr-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nexushr-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexushr-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexushr-db
          property: password
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 8080

  # 3. React 19 / TanStack Start Frontend
  - type: web
    name: nexushr-frontend
    plan: free
    env: docker
    rootDir: frontend
    envVars:
      - key: PORT
        value: 3000
      - key: API_URL
        fromService:
          type: web
          name: nexushr-backend
          envVarKey: RENDER_EXTERNAL_URL
