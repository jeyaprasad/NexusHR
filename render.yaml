databases:
  # 1. PostgreSQL Database
  - name: nexushr-db
    databaseName: nexushr
    user: nexushr_user

services:
  # 3. Spring Boot Backend
  - type: web
    name: nexushr-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render automatically provisions these environment variables internally
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: nexushr-db
          property: connectionString
      - key: HUGGINGFACE_API_TOKEN
        sync: false # You will need to manually add this in the Render dashboard

  # 4. React 19 Frontend
  - type: web
    name: nexushr-frontend
    env: docker
    rootDir: frontend
