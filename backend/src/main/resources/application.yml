server:
  port: 8080
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  shutdown: graceful
  tomcat:
    connection-timeout: 5000
    keep-alive-timeout: 30000
    max-keep-alive-requests: 100
    threads:
      max: 200
      min-spare: 20
    max-connections: 10000
    accept-count: 200

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  application:
    name: insiihr
  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.transformers.TransformersEmbeddingModelAutoConfiguration
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      pool-name: InsiihrPool
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
  ai:
    openai:
      api-key: ${GROQ_API_KEY:mock-key}
      base-url: https://api.groq.com/openai
      embedding:
        enabled: false
      chat:
        options:
          model: openai/gpt-oss-20b
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384
  threads:
    virtual:
      enabled: true

server.tomcat.threads.max: 200

app:
  jwt:
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.zidio.insiihr: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    io.sentry: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId:-}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId:-}] - %msg%n"
  file:
    name: logs/insiihr.log
    max-size: 100MB
    max-history: 30

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: InsiiHR
    version: 1.0.0
    description: AI-Enabled Enterprise HR Platform

huggingface:
  api:
    token: ${HUGGINGFACE_API_TOKEN:}
    url: "https://api-inference.huggingface.co/models/cardiffnlp/twitter-roberta-base-sentiment-latest"

resilience4j:
  circuitbreaker:
    instances:
      huggingface-api:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 5s
  timelimiter:
    instances:
      huggingface-api:
        timeout-duration: 10s
  retry:
    instances:
      huggingface-api:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
