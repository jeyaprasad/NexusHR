spring:
  application:
    name: nexushr-test
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.transformers.TransformersEmbeddingModelAutoConfiguration
  datasource:
    url: jdbc:h2:mem:nexushr_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    openai:
      api-key: mock-key
      base-url: https://api.groq.com/openai
      embedding:
        enabled: false
      chat:
        options:
          model: openai/gpt-oss-20b
  mail:
    host: localhost
    port: 1025

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:3000

huggingface:
  api:
    token: mock-token
    url: https://api-inference.huggingface.co/models/cardiffnlp/twitter-roberta-base-sentiment-latest
